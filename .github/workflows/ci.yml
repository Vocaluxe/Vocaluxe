name: CI

# Cross-platform build & unit tests for the .NET 10 port (#768). Verifies that the OS-conditional
# code paths (WIN / LINUX / MACOS defines) compile and the unit tests pass on Linux, Windows and
# macOS - the build breaks we cannot see when developing only on Linux.
#
# Scope: managed build + `dotnet test` (the tests only touch VocaluxeLib / managed code, no native
# libs or display). The native helpers (PitchTracker/Acinerella) and the GUI/audio/rendering are not
# exercised here - those stay manual.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tests/Tests.csproj

      # Builds the whole chain (VocaluxeLib + Vocaluxe + PartyModeChallenge + Tests), so a compile
      # break in any OS-conditional path fails here.
      - name: Build (Release)
        run: dotnet build Tests/Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Tests/Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/*.trx'
          if-no-files-found: ignore
