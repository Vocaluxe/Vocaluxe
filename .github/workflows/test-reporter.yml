name: 'Test Report'
on:
  workflow_run:
    workflows: ['Vocaluxe Nightly Builds']
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: dorny/test-reporter@v2
      with:
        artifact: /test-results-windows-(.*)/
        name: Unit Tests Windows $1               
        reporter: dotnet-nunit
        path: TestResult.xml